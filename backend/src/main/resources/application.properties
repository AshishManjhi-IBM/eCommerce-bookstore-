spring.application.name=ebookstore
server.port=8080

# --- PostgreSQL (override with DB_URL / DB_USERNAME / DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Application settings ---
app.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-32b}
app.jwt.expiration-minutes=120
# 1 gift point = Rs 1; points earned = 1% of the amount paid
app.gift-points.value-per-point=1
app.gift-points.earn-rate=0.01
app.tax-rate=0.05
# Delivery is free when subtotal >= threshold (0 disables the threshold)
app.shipping.free-threshold=500
# Sample books, categories, shipping rates and the admin user (created only when the DB is empty)
app.seed.enabled=true
app.seed.admin-email=admin@bookstore.com
app.seed.admin-password=Admin@123
